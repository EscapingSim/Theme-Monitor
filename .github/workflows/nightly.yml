name: Nightly theme update
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 5:30 PM Mountain (daylight time), weekdays
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        timeout-minutes: 30
      - name: Commit updated dashboard
        run: |
          git config user.name "theme-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data/history
          [ -f data/universe_cache.csv ] && git add data/universe_cache.csv
          git diff --cached --quiet && exit 0
          git commit -m "Nightly update $(date -u +%F)"
          git pull --rebase origin main
          git push
