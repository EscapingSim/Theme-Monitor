name: Nightly theme update
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 23:30 UTC = 5:30 PM Mountain (daylight time), weekdays
  workflow_dispatch: {}        # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        timeout-minutes: 30
      - name: Commit updated dashboard
        run: |
          git config user.name "theme-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data/history data/universe_cache.csv 2>/dev/null || git add docs data/history
          git diff --cached --quiet || git commit -m "Nightly update $(date -u +%F)"
          git push
