<style>
:root{--bg:#F3F5F8;--panel:#FFFFFF;--ink:#16202F;--muted:#677286;--line:#DDE2EA;--up:#0B7A55;--down:#C0392B;--sel:#2C5BD4;--selbg:#E8EEFC;--warn:#A05A00;--warnbg:#FFF1DB;--upbg:11,122,85;--downbg:192,57,43;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1520;--panel:#161E2B;--ink:#E6EBF2;--muted:#8D98AA;--line:#273244;--up:#3FC99A;--down:#F06B5B;--sel:#7EA2FF;--selbg:#1E2A44;--warn:#F2B35E;--warnbg:#3A2A12;--upbg:63,201,154;--downbg:240,107,91;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;margin-bottom:6px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.nav{display:flex;gap:4px}.nav a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:7px;font-weight:500}
.nav a[aria-current]{background:var(--selbg);color:var(--sel)}
.asof{color:var(--muted)}
.lead{color:var(--muted);margin:0 0 16px}
.lead b{color:var(--ink);font-weight:600}
h2{font-size:17px;font-weight:600;margin:26px 0 4px}
.hint{color:var(--muted);margin:0 0 10px;font-size:13px;max-width:80ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--selbg);color:var(--sel)}
.big button{padding:8px 16px;font-size:15px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none;background:var(--panel)}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.tag{font-size:11.5px;color:var(--muted)}
.star{color:var(--sel);font-weight:700}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--selbg);color:var(--sel)}
.badge.w{background:var(--warnbg);color:var(--warn)}
.tt{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.tt i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.tt i.on{background:var(--up)}
.rs{font-weight:700}
.empty{padding:18px;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;margin-top:24px;max-width:80ch}
.demo{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px}


.market{display:grid;grid-template-columns:minmax(220px,1fr) minmax(340px,1.35fr) minmax(220px,1fr) minmax(220px,1fr);gap:12px;margin:0 0 16px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mcard h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.mcard.rg{border-left:4px solid var(--rg)}
.mcard.up{--rg:var(--up)}.mcard.down{--rg:var(--down)}.mcard.mid{--rg:#C98A00}
.mcard .lab{font-weight:700;font-size:20px;color:var(--rg);margin-bottom:4px}
.mcard .note{color:var(--muted);font-size:13px;margin-bottom:8px}
.mcard .big{font-size:20px;font-weight:700}
.mcard .sub{color:var(--muted);font-size:12.5px}
.mcard table{min-width:0;width:100%}
.mcard td,.mcard th{padding:4px 5px;border:0;font-size:13px;cursor:default;position:static}
.mcard svg{display:block;margin-top:6px;width:100%}
@media (max-width:1100px){.market{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.market{grid-template-columns:1fr}}
</style>

  con:  {h:"Contractions",k:"contr",f:r=>`<span title="Depth of each pullback from a swing high since the base high (last 90 days), oldest to newest. Number in brackets = consecutive contractions.">${r.depths.length?r.depths.map(d=>d.toFixed(0)).join(" › ")+"%":"–"}</span> <span class="muted">(${r.contr})</span>`},
  tight:{h:"10D range",k:"tight",f:r=>`<span class="${r.tight<=6?"up":""}">${fmt(r.tight,1,false)}</span>`},
  dry:  {h:"Vol dry-up",k:"dryup",f:r=>r.dryup==null?"–":`<span class="${r.dryup<=0.7?"up":""}">${r.dryup.toFixed(2)}×</span>`},
  piv:  {h:"To pivot",k:"to_pivot",f:r=>`<span title="Pivot ${r.pivot}">${r.to_pivot<0?`<span class="up">${Math.abs(r.to_pivot).toFixed(1)}% above</span>`:fmt(r.to_pivot,1,false)}</span>`},
  rv:   {h:"Rel vol",k:"relvol",f:r=>r.relvol==null?"–":`<span class="${r.relvol>=1.5?"up":""}">${r.relvol.toFixed(1)}×</span>`},
  ext:  {h:"Over 50D",k:"ext50",f:r=>`<span class="${r.ext50>=25?"down":""}">${fmt(r.ext50)}</span>`},
  dv:   {h:"$ Vol (M)",k:"dvol",f:r=>r.dvol.toFixed(0)},
  vcp:  {h:"VCP",k:"vcp",f:r=>r.vcp?'<span class="badge">VCP-like</span>':""},
  nsig: {h:"Signals",k:"n_sig",f:r=>`<b>${r.n_sig}</b>`},
  sigs: {h:"Screens passed",l:1,k:"",f:r=>r.signals.map(x=>`<span class="badge">${x}</span>`).join(" ")+(r.warnings.length?" "+r.warnings.map(x=>`<span class="badge w">${x}</span>`).join(" "):"")},
  adr:  {h:"ADR",k:"adr",f:r=>fmt(r.adr,1,false)},
  m1:   {h:"1M",k:"r1m",f:r=>`<span class="${cls(r.r1m)}">${fmt(r.r1m,0)}</span>`},
  m3:   {h:"3M",k:"r3m",f:r=>`<span class="${cls(r.r3m)}">${fmt(r.r3m,0)}</span>`},
  m6:   {h:"6M",k:"r6m",f:r=>`<span class="${cls(r.r6m)}">${fmt(r.r6m,0)}</span>`},
  rng:  {h:"10D range",k:"rng10",f:r=>fmt(r.rng10,1,false)},
  h20:  {h:"To 20D high",k:"to_hi20",f:r=>r.to_hi20<0?`<span class="up">${Math.abs(r.to_hi20).toFixed(1)}% above</span>`:fmt(r.to_hi20,1,false)},
  gap:  {h:"Gap",k:"gap",f:r=>`<span class="up">${fmt(r.gap)}</span>`},
  neg:  {h:"Neglected",k:"neglected",f:r=>r.neglected?'<span class="badge">Yes</span>':'<span class="muted">Extended</span>'},
  e10:  {h:"vs 10 EMA",k:"ext10",f:r=>`<span class="${r.ext10>=15?"down":""}">${fmt(r.ext10)}</span>`},
  spr:  {h:"10/20 EMA gap",k:"spread",f:r=>fmt(r.spread,1,false)},
  kwhy: {h:"Signal",l:1,k:"k_warn",f:r=>[r.k_exh?'<span class="badge w">Exhaustion extension</span>':"",r.k_drop?'<span class="badge w">Wedge drop</span>':""].join(" ")},
  why:  {h:"Signal",l:1,k:"warn",f:r=>[r.climax?'<span class="badge w">Extended / climax watch</span>':"",r.break50?'<span class="badge w">Closed below 50D</span>':""].join(" ")},
};

function table(id,rows,cols,defSort){
  const s = st.sort[id] ||= {k:defSort, dir:-1};
  rows = [...rows].sort((a,b)=>{const x=a[s.k],y=b[s.k]; if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*s.dir;});
  if(!rows.length) return `<div class="scroll"><div class="empty">No stocks meet these conditions today.</div></div>`;
  return `<div class="scroll"><table data-id="${id}"><thead><tr>${cols.map(c=>`<th class="${C[c].l?"l":""}" data-k="${C[c].k}" aria-sort="${s.k===C[c].k?(s.dir<0?"descending":"ascending"):"none"}">${C[c].h}${s.k===C[c].k?(s.dir<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${C[c].l?"l":""}">${C[c].f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function base(){
  const q = st.q.toLowerCase();
  return D.rows.filter(r=>(!st.onlyLead||r.lead)&&(!st.onlyTheme||r.themes.length)&&(!q||r.ticker.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)));
}
function seg(opts,cur,attr){ return `<div class="seg" role="group">${opts.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${cur==k}">${l}</button>`).join("")}</div>`; }

function render(){
  $("#mode").innerHTML = [["sum","Summary"],["min","Minervini"],["zan","Zanger"],["qul","Qullamaggie"],["kel","Kell"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${st.mode===k}">${l}</button>`).join("");
  const B = base();
  let h = "";
  if(st.mode==="sum"){
    const rows = B.filter(r=>r.n_sig>=st.minSig);
    h += `<h2>All screens</h2><p class="hint">Every stock passing at least one screen, ranked by how many screens it passes. Warnings (amber) are listed but not counted.</p>
      <div class="controls">${seg([[1,"Any signal"],[2,"2+ screens"],[3,"3+ screens"]],st.minSig,"ms")}<span class="muted">${rows.length} stocks</span></div>`;
    h += table("sum",rows,["tick","name","nsig","sigs","rs","tt","last","d1","rv","hi","adr","dv"],"n_sig");
  } else if(st.mode==="qul"){
    const cols=["tick","name","rs","last","d1","m1","m3","m6","adr","rng","h20","rv","dv"];
    h += `<h2>Breakouts today</h2><p class="hint">Momentum leader (1M +25%, 3M +50% or 6M +100%) with ADR ${D.q_adr}%+, closing above its prior 10-day high on 1.5× or more volume.</p>`+table("qb",B.filter(r=>r.q_brk),cols,"relvol");
    h += `<h2>Setups</h2><p class="hint">Momentum leaders consolidating above rising 10/20-day averages: higher lows, 10-day range within 3× ADR, within 5% of the 20-day high. Buy the range breakout.</p>`+table("qs",B.filter(r=>r.q_setup&&!r.q_brk),cols,"rs");
    h += `<h2>Episodic pivots</h2><p class="hint">Gapped up ${D.ep_gap}%+ on ${D.ep_rv}× or more volume and held the open. Neglected means less than +30% in the 3 months before the gap. Check the catalyst.</p>`+table("qe",B.filter(r=>r.ep),["tick","name","rs","gap","d1","rv","neg","m3","adr","last","dv"],"gap");
  } else if(st.mode==="kel"){
    const cols=["tick","name","rs","tt","last","d1","rv","e10","spr","hi","dv"];
    h += `<h2>Wedge pop</h2><p class="hint">After 3+ of the last 5 closes below the 10 EMA, closed back above the 10 and 20 EMA (+2% or more on 1.2× volume) while the EMAs are converging. RS 60+.</p>`+table("kp",B.filter(r=>r.k_pop),cols,"relvol");
    h += `<h2>EMA crossback</h2><p class="hint">Uptrend (10 EMA above 20 EMA, above a rising 50-day) that pulled back from 5%+ over the 20 EMA to touch the 10 EMA and held the 20 EMA. RS 70+.</p>`+table("kc",B.filter(r=>r.k_cross),cols,"rs");
    h += `<h2>Base n' break</h2><p class="hint">Uptrend stock closing above a 30-day base (25% deep or less) on 1.4× or more volume. RS 70+.</p>`+table("kb",B.filter(r=>r.k_bnb),cols,"relvol");
    h += `<h2>Warnings</h2><p class="hint">Exhaustion extension: 2.5× ADR or more above the 10 EMA after a 15%+ week. Wedge drop: closed below both EMAs after holding the 20 EMA in an uptrend.</p>`+table("kw",B.filter(r=>r.k_warn),["tick","name","rs","kwhy","last","d1","rv","e10","adr","dv"],"rs");
  } else if(st.mode==="min"){
    const rows = B.filter(r=>r.tt_n>=st.tt && (!st.vcp||r.vcp));
    h += `<h2>Trend Template</h2><p class="hint">Stage 2 uptrend screen. VCP-like means 2+ shrinking pullbacks, a tight 10-day range (10% or less), volume drying up, and price within 10% of the pivot.</p>
      <div class="controls">${seg([[8,"8 of 8"],[7,"7 or more"]],st.tt,"tt")}<label class="chk"><input type="checkbox" id="vcp" ${st.vcp?"checked":""}> VCP-like only</label><span class="muted">${rows.length} stocks</span></div>`;
    h += table("min",rows,["tick","name","rs","tt","last","d1","hi","lo","con","tight","dry","piv","dv","vcp"],"rs");
  } else {
    const br = B.filter(r=>r.zan_break), nr = B.filter(r=>r.zan_near&&!r.zan_break), wn = B.filter(r=>r.warn);
    const cols = ["tick","name","rs","tt","last","d1","rv","piv","ext","tight","dv"];
    h += `<h2>Breakouts today</h2><p class="hint">Closed above the prior 50-day high on 1.5× or more average volume, above the 50D, RS 70+.</p>`+table("zb",br,cols,"relvol");
    h += `<h2>Near pivot</h2><p class="hint">Within 5% below the prior 50-day high, above the 50D, RS 80+. Watch for a volume breakout.</p>`+table("zn",nr,cols,"rs");
    h += `<h2>Warnings</h2><p class="hint">RS 70+ names that are 25%+ over the 50D after a 20%+ run in 3 weeks, or just closed below the 50D.</p>`+table("zw",wn,["tick","name","rs","why","last","d1","rv","ext","hi","dv"],"rs");
  }
  $("#view").innerHTML = h;
}

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.mode){ st.mode=t.dataset.mode; render(); }
  else if(t.dataset.ms){ st.minSig=+t.dataset.ms; render(); }
  else if(t.dataset.tt){ st.tt=+t.dataset.tt; render(); }
  else if(t.tagName==="TH"&&t.dataset.k){ const id=t.closest("table").dataset.id, s=st.sort[id]; s.dir = s.k===t.dataset.k?-s.dir:-1; s.k=t.dataset.k; render(); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="vcp"){ st.vcp=e.target.checked; render(); }
  if(e.target.id==="onlyLead"){ st.onlyLead=e.target.checked; render(); }
  if(e.target.id==="onlyTheme"){ st.onlyTheme=e.target.checked; render(); }
});
$("#q").oninput = e=>{ st.q=e.target.value; render(); };

$("#asof").textContent = `Close of ${new Date(D.as_of+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}`;
$("#lead").innerHTML = `Leading themes (★): ${D.lead_themes.map(t=>`<b>${esc(t)}</b>`).join(", ")}`;
if(D.demo) $("#demo").innerHTML = `<div class="demo">Demo data. Run the nightly job for real prices.</div>`;
$("#foot").textContent = `Screened ${D.universe.toLocaleString()} stocks (S&P 1500 plus your theme list), priced $${D.min_price}+ with $${D.min_dvol}M+ average daily dollar volume. RS is a 1–99 percentile of weighted 3/6/9/12-month returns (40/20/20/20) across that universe. Pivot is the prior 50-day high. Rules approximate each trader's published methods and build a review list; check every chart before acting. Updated ${D.generated}.`;
render();


(function(){
  const R=D.regime; if(!R) return;
  const pf=v=>v==null?"–":(v>0?"+":"")+v.toFixed(1)+"%";
  const tint=(v,cap)=>{ if(v==null) return ""; const a=Math.min(Math.abs(v)/cap,1)*0.38; return `background:rgba(var(${v>=0?"--upbg":"--downbg"}),${a.toFixed(3)})`; };
  const CAPS={r1d:3,r1w:6,r1m:12,r3m:25,ytd:40};
  const ma=(n,o)=>`<div class="sub">${n} <b class="${o.a50?"up":"down"}">${o.a50?"above":"below"} 50D</b>, <b class="${o.a200?"up":"down"}">${o.a200?"above":"below"} 200D</b></div>`;
  const W=300,H=56;
  // breadth line
  const s=R.b50_series, bx=i=>(i/(s.length-1)*W).toFixed(1), by=v=>(H-3-v/100*(H-6)).toFixed(1);
  const bline=`<svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${by(50)}" y2="${by(50)}" stroke="var(--line)" stroke-dasharray="4 3"/><polyline points="${s.map((v,i)=>bx(i)+","+by(v)).join(" ")}" fill="none" stroke="var(--sel)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  // NH/NL mirrored bars
  const n=R.nh_series.length, mx=Math.max(1,...R.nh_series,...R.nl_series), bw=W/n, mid=H/2;
  const bars=R.nh_series.map((v,i)=>`<rect x="${(i*bw+0.5).toFixed(1)}" y="${(mid-v/mx*(mid-2)).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${(v/mx*(mid-2)).toFixed(1)}" fill="var(--up)"/>`).join("")
          + R.nl_series.map((v,i)=>`<rect x="${(i*bw+0.5).toFixed(1)}" y="${mid}" width="${(bw-1).toFixed(1)}" height="${(v/mx*(mid-2)).toFixed(1)}" fill="var(--down)"/>`).join("");
  const nhnl=`<svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="none" aria-hidden="true">${bars}<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/></svg>`;
  document.getElementById("regime").innerHTML=`<div class="market">
    <div class="mcard rg ${R.tone}"><h3>Market regime</h3><div class="lab">${R.label}</div><div class="note">${R.note}</div>${ma("SPY",R.spy)}${ma("QQQ",R.qqq)}</div>
    <div class="mcard"><h3>Index performance</h3><table><thead><tr><th class="l"></th>${["1D","1W","1M","3M","YTD"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>
      ${Object.entries(R.idx).map(([k,x])=>`<tr><td class="l"><b>${k}</b></td>${["r1d","r1w","r1m","r3m","ytd"].map(c=>`<td style="${tint(x[c],CAPS[c])}">${pf(x[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="mcard" title="Share of ${R.n.toLocaleString()} stocks above their 50-day average over the last 60 sessions. Dashed line = 50%."><h3>Breadth: % above 50D</h3><span class="big">${R.b50}%</span> <span class="sub">5 days ago ${R.b50_5d}%. Above 200D: ${R.b200}%</span>${bline}</div>
    <div class="mcard" title="Daily count of new 52-week closing highs (green, up) and closing lows (red, down) across ${R.n.toLocaleString()} stocks, last 60 sessions."><h3>New 52W closing highs / lows</h3><span class="big"><span class="up">${R.nh}</span> / <span class="down">${R.nl}</span></span> <span class="sub">today. 10-day avg ${R.nh10} / ${R.nl10}</span>${nhnl}</div>
  </div>`;
})();
</script>
</body>
</html>
